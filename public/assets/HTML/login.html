<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en VITALIS - Recupera tu paz mental y potencia tu rendimiento">
    <meta name="theme-color" content="#030213">
    <title>VITALIS - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/dashboard-style.css">
    <script src="../scripts/vitalis_db.js"></script>

</head>
<body class="bg-zen-dark">

<div class="login-wrapper">
    <div class="login-card">
        <a href="../../../index.html" class="btn-back-login" title="Volver a la página principal">← Volver</a>

        <div class="text-center mb-32">
            <h1 class="login-title">Ingresar a VITALIS</h1>
            <p class="login-subtitle">Introduce tus datos de acceso habitual.</p>
        </div>

        <form id="form-login" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Nombre de Usuario o Correo</label>
                <input type="text" id="username" required placeholder="Ej. adminEstu o adminestu@upc.pe" class="form-input" aria-label="Nombre de usuario o correo">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••" class="form-input" aria-label="Contraseña">
            </div>

            <button type="submit" id="btn-submit-login" class="btn-login-submit" aria-label="Ingresar al Espacio Zen">
                Ingresar al Espacio Zen
            </button>

            <div class="login-divider">o</div>

            <a href="pricing.html" class="btn-create-account-link" aria-label="Crear nueva cuenta">Crear cuenta</a>
        </form>
    </div>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();

        const userInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value;

        if (!userInput || !passwordInput) {
            alert('Por favor completa todos los campos.');
            return;
        }

        if (typeof window.dbValidateLogin !== 'function') {
            alert('Error crítico: El archivo "vitalis_db.js" no se cargó en esta vista. Verifica las carpetas de la ruta.');
            return;
        }

        // Validación cruzada (cuenta o correo)
        const verifiedUser = window.dbValidateLogin(userInput, passwordInput);

        if (verifiedUser) {
            sessionStorage.setItem('vitalis_username', verifiedUser.fullname);
            sessionStorage.setItem('vitalis_role', verifiedUser.role);
            window.location.href = 'dashboard.html';
        } else {
            alert('Credenciales incorrectas. Verifica tu cuenta o correo electrónico y la contraseña.');
        }
    }
</script>
</body>
</html>
