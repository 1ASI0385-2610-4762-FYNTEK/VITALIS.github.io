</head>
<body>

<header class="dash-navbar">
    <div class="dash-nav-container">
        <span class="dash-brand">VITALIS // <span id="user-role-badge">Cargando...</span></span>
        <div class="user-profile-zone">
            <span id="welcome-user-text">Bienvenido</span>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>
</header>

<main class="dash-container">

</main>

<script>
    const aiRecommendations = {
        estudiante: {
            title: "Optimización de Enfoque Académico",
            body: "Detectamos semanas de alta carga. Te sugerimos estructurar sesiones de estudio usando bloques Pomodoro cerrados de 50 minutos con descansos de 10 minutos de desconexión visual total."
        },
        practicante: {
            title: "Mitigación del Sedentarismo y Presión",
            body: "Has acumulado más de 2 horas continuas en entornos de oficina. Sigue la guía de estiramientos ergonómicos para liberar la tensión acumulada en el cuello y la espalda."
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const username = sessionStorage.getItem('vitalis_username') || 'Usuario Temporal';
        const role = sessionStorage.getItem('vitalis_role') || 'estudiante';

        document.getElementById('welcome-user-text').innerText = `Sesión: ${username}`;

        const roleBadge = document.getElementById('user-role-badge');
        if(role === 'estudiante') {
            roleBadge.innerText = 'Perfil Universitario';
            roleBadge.className = 'badge-student';
            document.getElementById('conditional-work-block').style.opacity = '0.3';
        } else {
            roleBadge.innerText = 'Perfil Practicante Pre-Profesional';
            roleBadge.className = 'badge-intern';
        }

        const recommendation = aiRecommendations[role] || aiRecommendations.estudiante;
        document.getElementById('ai-suggestion-title').innerText = recommendation.title;
        document.getElementById('ai-suggestion-body').innerText = recommendation.body;
    });

    function addTask(e) {
        e.preventDefault();
        const input = document.getElementById('task-input');
        if (!input.value.trim()) return;

        const list = document.getElementById('task-list-zen');
        const li = document.createElement('li');
        li.className = 'task-item-zen';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.addEventListener('change', function () { toggleTask(this); });

        const span = document.createElement('span');
        span.textContent = input.value.trim();

        li.appendChild(checkbox);
        li.appendChild(span);
        list.appendChild(li);
        input.value = '';
    }

    function toggleTask(checkbox) {
        const text = checkbox.nextElementSibling;
        if (checkbox.checked) {
            text.style.textDecoration = 'line-through';
            text.style.opacity = '0.5';
        } else {
            text.style.textDecoration = 'none';
            text.style.opacity = '1';
        }
    }

    function feedbackAI(isUseful) {
        alert(isUseful
            ? "¡Gracias! El algoritmo priorizará este tipo de recomendaciones en tu bitácora Zen."
            : "Entendido. Ajustaremos los parámetros de IA para descartar este tema en tus próximas jornadas."
        );
    }

    function openStudyBlockForm() {
        const form = document.getElementById('study-block-form');
        form.classList.toggle('hidden-element');
    }

    function saveStudyBlock() {
        const subject = document.getElementById('study-subject').value;
        const time = document.getElementById('study-time').value;

        if (!subject || !time) {
            alert("Por favor completa los campos del horario de estudio.");
            return;
        }

        const timeline = document.getElementById('calendar-timeline-events');
        const block = document.createElement('div');
        block.className = 'time-block';

        const timeLabel = document.createElement('span');
        timeLabel.className = 'time-label';
        timeLabel.textContent = time;

        const pill = document.createElement('div');
        pill.className = 'event-pill event-study';
        pill.textContent = `🎓 Repaso Académico: ${subject}`;

        block.appendChild(timeLabel);
        block.appendChild(pill);
        timeline.appendChild(block);

        document.getElementById('study-subject').value = '';
        document.getElementById('study-time').value = '';
        openStudyBlockForm();
    }

    function registerMood(emoji, label) {
        const feedback = document.getElementById('mood-feedback-message');
        feedback.innerText = `Estado [${label}] registrado en tu historial diario con éxito.`;
        feedback.classList.remove('hidden-element');

        const stressBar = document.getElementById('live-stress-bar');
        if(emoji === ':(' || emoji === '>:(') {
            stressBar.style.height = '85px';
            stressBar.style.backgroundColor = '#666666';
        } else {
            stressBar.style.height = '30px';
            stressBar.style.backgroundColor = '#111111';
        }
    }

    function logout() {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
</script>
