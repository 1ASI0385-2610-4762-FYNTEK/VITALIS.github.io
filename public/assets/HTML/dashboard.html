<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VITALIS - Dashboard Zen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/dashboard-style.css">
    <link rel="stylesheet" href="../styles/zen-tools-style.css">
    <style>
        .dash-brand {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .dash-brand:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

<header class="dash-navbar">
    <div class="dash-nav-container">
        <!-- Al hacer clic te desplaza suavemente hacia el inicio del Dashboard -->
        <span class="dash-brand" onclick="window.scrollTo({top: 0, behavior: 'smooth'});">
            VITALIS // <span id="user-role-badge">Cargando...</span>
        </span>
        <div class="user-profile-zone">
            <span id="welcome-user-text">Bienvenido</span>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
    </div>
</header>

<main class="dash-container">
    <!-- Aquí se inyectan las tarjetas del ecosistema -->
    <div class="welcome-banner-card" style="margin-bottom: 24px;">
        <h2 id="ai-suggestion-title" style="font-family: 'Playfair Display', serif; font-size: 24px; margin-bottom: 8px;">Cargando sugerencias...</h2>
        <p id="ai-suggestion-body" style="color: #666666; font-size: 14px;"></p>
    </div>
</main>

<script>
    const aiRecommendations = {
        estudiante: {
            title: "Optimización de Enfoque Académico",
            body: "Detectamos semanas de alta carga. Te sugerimos estructurar sesiones de estudio usando bloques Pomodoro cerrados de 50 minutos con descansos de 10 minutos de desconexión visual total."
        },
        practicante: {
            title: "Mitigación del Sedentarismo y Presión",
            body: "Has acumulado más de 2 horas continuas en entornos de oficina. Sigue la guía de estiramientos ergonómicos para liberar la tensión acumulada en el cuello y la espalda."
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        const username = sessionStorage.getItem('vitalis_username') || 'Usuario Temporal';
        const role = sessionStorage.getItem('vitalis_role') || 'estudiante';

        document.getElementById('welcome-user-text').innerText = `Sesión: ${username}`;

        const roleBadge = document.getElementById('user-role-badge');
        if(role === 'estudiante') {
            roleBadge.innerText = 'Perfil Universitario (Admin)';
            roleBadge.className = 'badge-student';
        } else {
            roleBadge.innerText = 'Perfil Practicante Pre-Profesional (Admin)';
            roleBadge.className = 'badge-intern';
        }

        const recommendation = aiRecommendations[role] || aiRecommendations.estudiante;
        document.getElementById('ai-suggestion-title').innerText = recommendation.title;
        document.getElementById('ai-suggestion-body').innerText = recommendation.body;
    });

    function logout() {
        sessionStorage.clear();
        window.location.href = 'login.html';
    }
</script>
